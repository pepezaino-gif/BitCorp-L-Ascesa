<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BitCorp: L'Ascesa</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131c2e;
            --accent-cyan: #00f2fe;
            --accent-pink: #ff007f;
            --text-main: #e2e8f0;
            --text-dim: #94a3b8;
            --border-color: #1e293b;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Share Tech Mono', monospace;
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .header-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        #main-counter {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--accent-cyan);
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
        }

        #per-second {
            font-size: 0.9rem;
            color: var(--text-dim);
            margin-top: 4px;
        }

        .tabs {
            display: flex;
            gap: 6px;
            justify-content: space-between;
        }

        .tab-btn {
            flex: 1;
            background: var(--card-bg);
            color: var(--text-dim);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px 4px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .tab-btn.active, .tab-btn:hover {
            background: rgba(0, 242, 254, 0.1);
            color: var(--accent-cyan);
            border-color: var(--accent-cyan);
        }

        .tab-content {
            display: none;
            flex-direction: column;
            gap: 10px;
        }

        .tab-content.active {
            display: flex;
        }

        .section-title {
            font-size: 1rem;
            color: var(--text-dim);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 6px;
            margin-top: 5px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        #big-clicker {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 2px solid var(--accent-pink);
            color: var(--text-main);
            padding: 20px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 4px 12px rgba(255, 0, 127, 0.2);
            transition: transform 0.05s ease, background 0.2s;
        }

        #big-clicker:active {
            transform: scale(0.98);
            background: var(--accent-pink);
            color: #000;
        }

        .gen-item, .ach-item {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .gen-info {
            flex: 1;
        }

        .gen-title {
            font-size: 0.95rem;
            font-weight: bold;
            color: var(--text-main);
        }

        .gen-stats {
            font-size: 0.8rem;
            color: var(--text-dim);
            margin-top: 2px;
        }

        .buy-btn {
            background: #1e293b;
            color: var(--text-dim);
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 8px 12px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.8rem;
            cursor: not-allowed;
            text-align: center;
        }

        .buy-btn.can-afford {
            background: rgba(0, 242, 254, 0.15);
            color: var(--accent-cyan);
            border-color: var(--accent-cyan);
            cursor: pointer;
            box-shadow: 0 0 8px rgba(0, 242, 254, 0.2);
        }

        .buy-btn.can-afford:hover {
            background: var(--accent-cyan);
            color: #0b0f19;
        }

        .click-text {
            position: absolute;
            color: var(--accent-cyan);
            font-weight: bold;
            font-size: 1.1rem;
            pointer-events: none;
            text-shadow: 0 0 5px rgba(0, 242, 254, 0.5);
            animation: floatUp 0.8s ease-out forwards;
        }

        @keyframes floatUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-40px); opacity: 0; }
        }

        .unlocked {
            border-color: var(--accent-cyan);
            background: rgba(0, 242, 254, 0.05);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header Crediti -->
        <div class="header-box">
            <div style="font-size: 0.75rem; letter-spacing: 2px; color: var(--text-dim);">CREDITI DISPONIBILI</div>
            <div id="main-counter">0</div>
            <div id="per-second">Crediti al secondo: 0</div>
        </div>

        <!-- Menu Tab (Ordine rigoroso: generators [0], missions [1], prestige [2], stats [3]) -->
        <div class="tabs">
            <button class="tab-btn active" onclick="openTab('generators')">Impianti</button>
            <button class="tab-btn" onclick="openTab('missions')">Missioni</button>
            <button class="tab-btn" onclick="openTab('prestige')">Ascensione</button>
            <button class="tab-btn" onclick="openTab('stats')">Log</button>
        </div>

        <!-- Tab 0: Impianti -->
        <div id="generators" class="tab-content active">
            <div class="section-title">Attività Manuale</div>
            <button id="big-clicker">DECRYPTA DATI</button>
            
            <div class="section-title" style="margin-top: 10px;">Infrastruttura di Rete</div>
            <div id="generators-list"></div>
        </div>

        <!-- Tab 1: Missioni -->
        <div id="missions" class="tab-content">
            <div class="section-title">Contratti di Hacking</div>
            <div id="missions-list"></div>
        </div>

        <!-- Tab 2: Ascensione -->
        <div id="prestige" class="tab-content">
            <div class="section-title">Protocollo di Ascensione</div>
            <div class="gen-item" style="flex-direction: column; align-items: flex-start; gap: 8px;">
                <div style="width: 100%; display: flex; justify-content: space-between;"><span>Moltiplicatore Frammenti:</span> <span id="prestige-mult" style="color:var(--accent-cyan);">x1.00</span></div>
                <div style="width: 100%; display: flex; justify-content: space-between;"><span>Frammenti Disponibili:</span> <span id="prestige-pending" style="color:var(--accent-cyan);">0 FT</span></div>
                <button id="prestige-btn" class="buy-btn" style="width: 100%; margin-top: 5px;" disabled>ATTIVA PROTOCOLLO DI ASCENSIONE</button>
            </div>
        </div>

        <!-- Tab 3: Log e Statistiche -->
        <div id="stats" class="tab-content">
            <div class="section-title">Statistiche di Sistema</div>
            <div class="gen-item"><span>Totale Clic Eseguiti:</span> <span id="total-clicks" style="color:var(--accent-cyan);">0</span></div>
            <div class="gen-item"><span>Tempo di Sessione:</span> <span id="play-time" style="color:var(--accent-cyan);">0s</span></div>
            <div class="section-title" style="margin-top: 10px;">Archivio Successi</div>
            <div id="achievements-list"></div>
        </div>
    </div>

    <!-- Script Collegati -->
    <script src="game.js"></script>
    <script src="missions.js"></script>
</body>
</html>
