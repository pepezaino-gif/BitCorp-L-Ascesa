<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER TERMINAL // EXPLOIT</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050805;
            --matrix-green: #00ff66;
            --matrix-dim: #003311;
            --matrix-glow: rgba(0, 255, 102, 0.4);
            --border-green: #00aa44;
        }

        body {
            background-color: var(--bg-color);
            color: var(--matrix-green);
            font-family: 'Share Tech Mono', monospace;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* Effetto scanlines stile monitor CRT */
        body::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 99999;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Contatore Principale Dinamico */
        .header-box {
            border: 1px dashed var(--matrix-green);
            padding: 15px;
            text-align: center;
            background: rgba(0, 20, 5, 0.8);
            box-shadow: 0 0 10px var(--matrix-glow);
            animation: pulseGlow 2s infinite alternate;
        }

        #main-counter {
            font-size: 2.5rem;
            font-weight: bold;
            text-shadow: 0 0 8px var(--matrix-green);
        }

        #per-second {
            font-size: 0.9rem;
            color: #88ffaa;
        }

        /* Menu a Tab dinamico */
        .tabs {
            display: flex;
            gap: 4px;
            justify-content: space-between;
        }

        .tab-btn {
            flex: 1;
            background: var(--bg-color);
            color: var(--matrix-green);
            border: 1px solid var(--border-green);
            padding: 8px 4px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active, .tab-btn:hover {
            background: var(--matrix-green);
            color: var(--bg-color);
            box-shadow: 0 0 8px var(--matrix-green);
            font-weight: bold;
        }

        .tab-content {
            display: none;
            flex-direction: column;
            gap: 10px;
        }

        .tab-content.active {
            display: flex;
        }

        .section-title {
            font-size: 1.1rem;
            border-bottom: 1px solid var(--border-green);
            padding-bottom: 4px;
            margin-top: 5px;
            letter-spacing: 1px;
        }

        /* Bottone Centrale Hacking (Clicker) */
        #big-clicker {
            background: var(--matrix-dim);
            border: 2px solid var(--matrix-green);
            color: var(--matrix-green);
            padding: 20px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.2rem;
            cursor: pointer;
            text-align: center;
            box-shadow: inset 0 0 10px var(--matrix-glow);
            transition: transform 0.05s ease, background 0.2s;
        }

        #big-clicker:active {
            transform: scale(0.97);
            background: var(--matrix-green);
            color: var(--bg-color);
        }

        /* Oggetti / Impianti / Missioni */
        .gen-item, .ach-item {
            border: 1px solid var(--border-green);
            background: rgba(0, 10, 3, 0.6);
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .gen-info {
            flex: 1;
        }

        .gen-title {
            font-size: 0.95rem;
            font-weight: bold;
        }

        .gen-stats {
            font-size: 0.8rem;
            color: #88ffaa;
        }

        .buy-btn {
            background: #111;
            color: #555;
            border: 1px solid #444;
            padding: 6px 10px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.8rem;
            cursor: not-allowed;
            text-align: center;
        }

        .buy-btn.can-afford {
            background: var(--matrix-dim);
            color: var(--matrix-green);
            border-color: var(--matrix-green);
            cursor: pointer;
            box-shadow: 0 0 5px var(--matrix-glow);
            animation: buttonFlash 1s infinite alternate;
        }

        .buy-btn.can-afford:hover {
            background: var(--matrix-green);
            color: var(--bg-color);
        }

        /* Effetti fluttuanti dei clic */
        .click-text {
            position: absolute;
            color: #fff;
            font-weight: bold;
            font-size: 1.1rem;
            pointer-events: none;
            text-shadow: 0 0 5px var(--matrix-green);
            animation: floatUp 0.8s ease-out forwards;
        }

        @keyframes floatUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-40px); opacity: 0; }
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 5px rgba(0,255,102,0.2); }
            100% { box-shadow: 0 0 15px rgba(0,255,102,0.6); }
        }

        @keyframes buttonFlash {
            0% { border-color: var(--border-green); }
            100% { border-color: #fff; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header con Crediti -->
        <div class="header-box">
            <div style="font-size: 0.8rem; letter-spacing: 2px;">[CREDITI_ESTRATTI]</div>
            <div id="main-counter">0</div>
            <div id="per-second">Flusso: 0/s</div>
        </div>

        <!-- Menu di Navigazione Tab -->
        <div class="tabs">
            <button class="tab-btn active" onclick="openTab('generators')">Terminal</button>
            <button class="tab-btn" onclick="openTab('missions')">Missioni</button>
            <button class="tab-btn" onclick="openTab('prestige')">Ascensione</button>
            <button class="tab-btn" onclick="openTab('stats')">Log</button>
        </div>

        <!-- TAB 1: IMPIANTI E CLICKER -->
        <div id="generators" class="tab-content active">
            <div class="section-title">> ATTIVITÀ MANUALE</div>
            <button id="big-clicker">DECRYPT DATA [ESEGUI]</button>
            
            <div class="section-title" style="margin-top: 10px;">> ARCHITETTURA DI RETE</div>
            <div id="generators-list"></div>
        </div>

        <!-- TAB 2: MISSIONI (File missions.js) -->
        <div id="missions" class="tab-content">
            <div class="section-title">> CONTRATTI DI HACKING</div>
            <div id="missions-list"></div>
        </div>

        <!-- TAB 3: ASCENSIONE / PRESTIGE -->
        <div id="prestige" class="tab-content">
            <div class="section-title">> PROTOCOLLO DI RESET</div>
            <div class="gen-item" style="flex-direction: column; align-items: flex-start; gap: 5px;">
                <div>Moltiplicatore Naniti: <span id="prestige-mult" style="color:#fff;">x1.00</span></div>
                <div>Naniti Disponibili: <span id="prestige-pending" style="color:#fff;">0 NT</span></div>
                <button id="prestige-btn" class="buy-btn" style="width: 100%; margin-top: 5px;" disabled>AVVIA PROTOCOLLO</button>
            </div>
            <div class="section-title" style="margin-top: 10px;">> EXTRA OVERCLOCK</div>
            <button id="watch-ad-btn" class="buy-btn can-afford" style="width: 100%; padding: 12px;">ATTIVA OVERCLOCK x2 (5m)</button>
        </div>

        <!-- TAB 4: STATISTICHE / LOG -->
        <div id="stats" class="tab-content">
            <div class="section-title">> LOG DI SISTEMA</div>
            <div class="gen-item"><span>Totale Clic Eseguiti:</span> <span id="total-clicks" style="color:#fff;">0</span></div>
            <div class="gen-item"><span>Tempo di Sessione:</span> <span id="play-time" style="color:#fff;">0s</span></div>
            <div class="section-title" style="margin-top: 10px;">> ARCHIVIO SUCCESSI</div>
            <div id="achievements-list"></div>
        </div>
    </div>

    <!-- Script di Gioco -->
    <script src="game.js"></script>
    <script src="missions.js"></script>
</body>
</html>
